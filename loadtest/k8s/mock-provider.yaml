# STAGING ONLY. Mock external provider for capacity tests, so load never reaches real bureau /
# KYC / bank-statement sandboxes. go-httpbin answers GET|POST /delay/<seconds> after that delay.
#
# Three Services point at the same pods ON PURPOSE: ESA caps concurrent connections PER HOST
# (MaxConnsPerHost=25, common_modules.go:1024). Production sequences call several distinct
# provider hosts, so the mock must expose several hosts too, otherwise the 25-per-host cap would
# throttle the test in a way production never sees.
#
# kubectl apply -n staging -f mock-provider.yaml
# kubectl delete -n staging -f mock-provider.yaml      # cleanup
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadtest-mock-provider
  namespace: staging
  labels: { app: loadtest-mock-provider, purpose: loadtest }
spec:
  replicas: 2
  selector:
    matchLabels: { app: loadtest-mock-provider }
  template:
    metadata:
      labels: { app: loadtest-mock-provider, purpose: loadtest }
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:2.25.0
          ports: [{ containerPort: 8080 }]
          env:
            - { name: PORT, value: "8080" }
            - { name: MAX_DURATION, value: "120s" }   # default is 10s; provider p99s can exceed that
            - { name: LOG_LEVEL, value: "WARN" }
          resources:
            requests: { cpu: 250m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
          readinessProbe:
            httpGet: { path: /status/200, port: 8080 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: mock-bureau, namespace: staging, labels: { purpose: loadtest } }
spec:
  selector: { app: loadtest-mock-provider }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: mock-kyc, namespace: staging, labels: { purpose: loadtest } }
spec:
  selector: { app: loadtest-mock-provider }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: mock-bank, namespace: staging, labels: { purpose: loadtest } }
spec:
  selector: { app: loadtest-mock-provider }
  ports: [{ port: 80, targetPort: 8080 }]
